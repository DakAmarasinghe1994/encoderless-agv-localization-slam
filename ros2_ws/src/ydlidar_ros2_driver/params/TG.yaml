ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 512000
    lidar_type: 0   # TYPE_TOF
    device_type: 0  # YDLIDAR_TYPE_SERIAL
    sample_rate: 20
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: false
    intensity_bit: 0
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0  # Default = 50.0 m
    range_min: 0.10  # Default = 0.01 m
    frequency: 10.0
    invalid_range_is_inf: false
    debug: false
